# This workflow will do a clean installation of node dependencies, cache/restore them,
# build the source code and run linting across different versions of node.

name: Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: FrontEndIng/package-lock.json

      - name: Install dependencies
        working-directory: ./FrontEndIng
        run: npm ci

      - name: Run lint
        working-directory: ./FrontEndIng
        run: npm run lint

      - name: Build app
        working-directory: ./FrontEndIng
        run: npm run build --if-present
